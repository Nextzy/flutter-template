name: example_app
description: "A new example app project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  design_system:
    path: ../../packages/design_system
  localization:
    path: ../../packages/localization
  utils:
    path: ../../packages/utils

  auto_route: ^9.3.0+1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  auto_route_generator: ^9.3.1

flutter:
  uses-material-design: true
