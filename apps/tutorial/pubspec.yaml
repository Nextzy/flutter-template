name: tutorial
description: "You can delete this package when you create new project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  change_application_name:
    path: ../../apps/app

  auto_route: ^10.0.1
  drift: ^2.26.0
  drift_flutter: ^0.2.4

dependency_overrides:
  # Resolve for wechat_assets_picker
  extended_image: ^10.0.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  auto_route_generator: ^10.0.1
  json_serializable: ^6.9.4
  freezed: ^3.0.4
  retrofit_generator: ^9.1.9


flutter:
  uses-material-design: true
