name: widgetbook_app
description: "A flutter widget book project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  change_application_name:
    path: ../../apps/app
  tutorial:
    path: ../../apps/tutorial

  widgetbook_annotation: ^3.5.0
  widgetbook: ^3.14.2

dependency_overrides:


dev_dependencies:
  build_runner: ^2.4.15
  widgetbook_generator: ^3.13.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
