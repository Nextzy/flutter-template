name: playground
description: "Playground project"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  change_application_name:
    path: ../../apps/app

  auto_route: ^10.0.1

dependency_overrides:
  # Resolve for wechat_assets_picker
  extended_image: ^9.1.0


dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  auto_route_generator: ^10.0.1

flutter:
  uses-material-design: true
